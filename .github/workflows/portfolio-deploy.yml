name: Portfoio

on:
 push:
    branches: [main]

permissions: 
       pages: write
       id-token: write

jobs:
    deploy:
      runs-on: ubuntu-latest

      environment:
        name: github-pages
        url: ${{steps.deployment.outputs.page_url}}

      steps:
       # Get Aaccess to your code Portfolio code via a pre-built acttions
       # clone or check out the code where this workflow is written
        - name: Checkout Code
          uses: actions/checkout@v4
       # setup GitHub Pages
        - name: Setup Github Pages
          uses: actions/configure-pages@v4

        # static code artifacts
        - name: Upload static files
          uses: actions/upload-pages-artifacts@v4

        - name: Deploy to GitHub Pages
          uses: actions/deploy-pages@v4
          
